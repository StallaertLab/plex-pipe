# globus_config.yaml.example

gc:
  # Get this from developers.globus.org (looks like a UUID)
  client_id: "00000000-0000-0000-0000-000000000000"

  collections:
    remote_source:
      # Find this on the Globus Web App under 'Collection Search'
      id: "source-collection-uuid-here"
      root: "/path/to/remote/data"

    local_workstation:
      # Find this on the Globus Web App under 'Collection Search'
      # The UUID of your Globus Connect Personal endpoint
      id: "destination-collection-uuid-here"
      # null: full paths on Mac/Linux, drive letters (/C/...) on Windows,
      # as Globus Connect Personal uses. Set a folder only if the collection
      # is rooted there, e.g. "/home/user/data"
      root: null

transfer_tokens:
  # Tokens are long alphanumeric strings obtained via the login flow
  refresh_token: "paste-refresh-token-here"
