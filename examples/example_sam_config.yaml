# Configuration for different workstations
workstations:

  WORKSTATION_NAME_1: # workstation name (to get it: `hostname`(bash) or platform.node() (python))
    model_path: "/mnt/d/path/to/sam2" # path to the SAM2 model checkpoints (WSL path on Windows)
    sam_env: "/home/<username>/sam2_env/bin/python" # python of the SAM2 environment
