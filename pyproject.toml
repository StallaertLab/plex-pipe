# =============================================================================
# BUILD SYSTEM
# =============================================================================
[build-system]
requires = ["setuptools>=77", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

# =============================================================================
# PROJECT METADATA
# =============================================================================
[project]
name = "plex_pipe"
requires-python = ">=3.12"
dynamic = ["version"]
description = "A pipeline from multiplexed whole-slide images to single-cell data, with human-in-the-loop ROI definition and quality control."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Kasia Kedziora", email = "kedziorak@psc.edu" }
]
keywords = [
    "pipeline", "multiplexed imaging", "spatial proteomics", "Cell DIVE",
    "tissue microarray", "segmentation", "single-cell", "napari", "spatialdata",
    "scverse", "bioimage analysis",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

# =============================================================================
# DEPENDENCIES
# =============================================================================

dependencies = [
    # Upper cap: napari-spatialdata 0.7.2 calls the private AnnData._get_X,
    # which anndata 0.13 removed. Fixed on napari-spatialdata main (unreleased).
    # Drop the cap once a release > 0.7.2 ships. See tracking issue.
    "anndata>=0.11.4,<0.13",
    "dask[array]>=2024.4",
    "imagecodecs>=2024.6.1",
    "loguru>=0.7.3",
    "numpy>=2.0",
    "opencv-python>=4.9",
    "pandas>=2.1",
    "pydantic>=2.7.6",
    "pyyaml>=6.0.2",
    "scikit-image>=0.24",
    "scipy>=1.11",
    "shapely>=2.0",
    "spatialdata>0.7",
    "tifffile>=2024.7.2",
    "zarr>3.0",
    "fsspec>=2024.6.1",
    "dearrayer>=0.1.0",
    "pooch>=1.8",
]

[project.urls]
Homepage = "https://github.com/plexpipe/plex-pipe"
Documentation = "https://plexpipe.github.io/plex-pipe/"
Repository = "https://github.com/plexpipe/plex-pipe"
Issues = "https://github.com/plexpipe/plex-pipe/issues"
Changelog = "https://github.com/plexpipe/plex-pipe/blob/main/CHANGELOG.md"

[project.scripts]
plexpipe = "plex_pipe.cli:main"

[project.optional-dependencies]
jupyter = [
    "ipykernel>=6.0",
    "ipywidgets>=8.1.8",
]
globus = [
    "globus-sdk>= 3.59.0",
]
segmentation = [
    "torch",
    "torchvision",
    "cellpose>=4.0",
    "instanseg-torch>=0.0.9",
]
gui = [
    "qtpy>=2.4.0",
    "PySide6>=6.7",
    "napari>=0.6.6",
    "napari-spatialdata>0.5.7",
]
all = [
    "plex_pipe[jupyter,globus,gui,segmentation]"
]
# Same as `all`, but torch/torchvision are listed DIRECTLY so [tool.uv.sources]
# can route them to the CUDA index (uv only honours `extra =` routing for
# packages that are direct members of the extra). Dev-only; not for PyPI users.
all-cuda = [
    "torch",
    "torchvision",
    "plex_pipe[jupyter,globus,gui,segmentation]"
]

[dependency-groups]
# Documentation toolchain only. Kept as its own group so the docs CI can install
# JUST these (+ the core package) — no torch/napari extras, no test tooling.
docs = [
    "mkdocs>=1.5.0,<2",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-macros-plugin>=1.5.0",
    "mike>=2.2.0",
]
# Shared dev tooling (no torch/project extras here so it stays platform-neutral).
# Includes the `docs` group so a full dev sync still gets the docs tools too.
dev = [
    "black>=23.3.0",
    "ruff>=0.0.241",
    "tox>=4.12.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.6.0",
    "mypy>=1.19.1",
    "types-pyyaml>=6.0.12.20250915",
    { include-group = "docs" },
]

# =============================================================================
# UV CONFIGURATION
# =============================================================================

[tool.uv]
# `all` (platform-default torch) and `all-cuda` (CUDA torch) install different
# torch builds, so they must never resolve together. The conflict lets uv keep a
# separate torch for each instead of collapsing everything onto the CUDA build
# (which would break macOS, where no cu126 wheel exists).
conflicts = [
    [{ extra = "all" }, { extra = "all-cuda" }],
]
# The version comes from git (setuptools_scm), so rebuild the editable install
# after a new commit or tag; otherwise the installed version goes stale.
# Setting cache-keys replaces uv's defaults, so pyproject.toml is listed again.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# Route torch/torchvision to the CUDA (cu126) index ONLY for `all-cuda`, and never
# on macOS (no CUDA on Apple Silicon). `all` is deliberately NOT routed — it takes
# plain PyPI torch: CUDA on Linux, CPU on Windows, CPU+MPS on macOS.
[tool.uv.sources]
torch = [
  { index = "pytorch-cuda", extra = "all-cuda", marker = "sys_platform != 'darwin'" },
]
torchvision = [
  { index = "pytorch-cuda", extra = "all-cuda", marker = "sys_platform != 'darwin'" },
]

# =============================================================================
# TOOL CONFIGURATION
# =============================================================================
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]
"plex_pipe" = ["py.typed"]

[tool.setuptools_scm]
write_to = "src/plex_pipe/_version.py"
# Only version tags (v0.1.0) define the package version. Without --match, the
# data-release tag `example-data-v1` is parsed as version 1, and the package
# version jumps to 2.dev* -- which would sort above the real 0.1.0 release.
git_describe_command = "git describe --dirty --tags --long --match v[0-9]*"

[tool.black]
line-length = 88
# py314 is not a target in black 24.10 (pre-commit pin); py313 covers 3.14.
target-version = ['py312', 'py313']

[tool.ruff]
line-length = 88
lint.select = [
    "E", "F", "W", #flake8
    "UP", # pyupgrade
    "I", # isort
    "BLE", # flake8-blind-exception
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "C4", # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
    "NPY", # numpy types
    "ARG", # unused arguments
    "PT", # pytest style
    "PD", # pandas vet
]
lint.ignore = [
    "E501", # line too long. let black handle this
    "SIM117", # flake8-simplify
    "PD901", # Allow the variable name 'df'
]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*vendored*",
    "*_vendor*",
    "*.ipynb",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.12"

mypy_path = "src"
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "plex_pipe._version",
]
ignore_errors = true
